  .hright { margin-left: auto; font-size: 11px; opacity: 0.5; }

  /* TOOLBAR */

    background: #0d3272;
    border-top: 1px solid rgba(255,255,255,0.08);
    padding: 9px 22px;
    display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
    position: relative; z-index: 1000;
  }
  .tbtn {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 15px; border-radius: 999px;
    border: 1.5px solid; cursor: pointer;
    font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    background: rgba(255,255,255,0.07); color: white;
    transition: opacity 0.15s, background 0.15s; user-select: none;
  }
  .tbtn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .tbtn.off { opacity: 0.25; }
  .tbtn:hover:not(.off) { background: rgba(255,255,255,0.14); }
  #srch {
    flex: 1; min-width: 150px; max-width: 240px;
    padding: 6px 13px; border-radius: 999px;

  #counts { margin-left: auto; display: flex; gap: 14px; font-size: 10.5px; color: rgba(255,255,255,0.5); }
  #counts strong { font-weight: 700; }

  /* MAP */
  #map { width: 100%; height: calc(100vh - 108px); background: #b8d8ed; }

  /* County boundary style */

    fill: none;
    stroke: #2a5298;
    stroke-width: 1.2;
    stroke-opacity: 0.45;
    stroke-dasharray: 4 3;
  }

  /* Mute the tiles gently — no hue-rotate so ocean stays blue, land stays natural */
  .leaflet-tile {
    filter: saturate(0.55) brightness(1.06) contrast(0.90) opacity(0.90);
  }

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;

let markers = [];

// ── Map
const map = L.map("map", { zoomControl:true }).setView([34.05, -118.30], 9);

// ── Map tiles: CartoDB Voyager PNGs have transparent ocean areas,
// so the #map background color (#b8d8ed) shows through as natural ocean blue.
// Land, roads, and labels are fully opaque on top.
L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
  attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>',
  subdomains:"abcd", minZoom:0, maxZoom:20
}).addTo(map);

// ── County boundaries for California (Southern CA counties)
// Using public GeoJSON from the US Census / public CDN
const CA_COUNTIES_URL = "https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/california-counties.geojson";

fetch(CA_COUNTIES_URL)
  .then(r => r.json())
  .then(data => {
    L.geoJSON(data, {
      style: {
        color: "#1a3a7a",
        weight: 1.4,
        opacity: 0.5,
        fillOpacity: 0,
        dashArray: "5 4"
      },
      onEachFeature: (feature, layer) => {
        if (feature.properties && feature.properties.name) {
          layer.bindTooltip(feature.properties.name + " County", {
            permanent: false,
            className: "county-tooltip",
            direction: "center"
          });
        }
      }
    }).addTo(map);
  })
  .catch(() => console.warn("County data could not be loaded"));

  if (type === "hospital") {
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
      <rect x="1" y="1" width="30" height="30" rx="5" fill="${c}" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.3))"/>
      <text x="16" y="22" text-anchor="middle" font-size="18" font-weight="900" fill="white" font-family="Arial,sans-serif">+</text>
    </svg>`;

// ── Render
function render() {
  markers.forEach(({m, lbl}) => { map.removeLayer(m); if(lbl) map.removeLayer(lbl); });
  markers = [];

  LOCS.forEach(loc => {
    const visible = active[loc.type] &&
      (!q || loc.name.toLowerCase().includes(q) || loc.addr.toLowerCase().includes(q));

    const m = L.marker([loc.lat, loc.lng], { icon: makeIcon(loc.type) });
    m.on("click", () => openPanel(loc));

    // Name label
    const lblClass = `pin-lbl lbl-${loc.type}`;
    const anchorX = Math.round(loc.name.length * 3.4); // approx half-width
    const anchorY = loc.type === "clinic" ? 58 : loc.type === "asc" ? 34 : 22;
    const lbl = L.marker([loc.lat, loc.lng], {
      icon: L.divIcon({
        html: `<div class="${lblClass}">${loc.name}</div>`,
        iconAnchor: [anchorX, anchorY],
        className: ""
      }),
      interactive: false, zIndexOffset: -200
    });

    if (visible) { m.addTo(map); lbl.addTo(map); }
    markers.push({ m, lbl, loc, visible });
  });

  ["clinic","hospital","asc"].forEach(t => {
    const total = LOCS.filter(l => l.type===t).length;
    const shown = markers.filter(({loc,visible}) => loc.type===t && visible).length;
    const el = document.getElementById("c-"+t);
    if (el) el.innerHTML = `<strong style="color:${CLR[t]}">${shown}/${total}</strong> ${LBL[t].toLowerCase()}s`;
  });
}

function toggle(type) {
  active[type] = !active[type];
  document.getElementById("btn-"+type).classList.toggle("off", !active[type]);
  render();
}

function doSearch(v) { q = v.toLowerCase(); render(); }

function openPanel(loc) {
  document.getElementById("pname").textContent = loc.type === "clinic" ? "LACENTA " + loc.name : loc.name;
  const b = document.getElementById("pbadge");
  b.textContent = LBL[loc.type]; b.style.background = BG[loc.type]; b.style.color = CLR[loc.type];
  const cs = document.getElementById("pcoming");
  if (loc.cs) { cs.textContent = loc.cs; cs.style.display="inline-block"; } else { cs.style.display="none"; }
  document.getElementById("paddr").innerHTML = loc.addr.replace("\n","<br>");
  document.getElementById("pphone").textContent = loc.phone;
  document.getElementById("panel").style.display = "block";
}

function closePanel() { document.getElementById("panel").style.display="none"; }

render();
</script>
